# Applied after @deepseek-ai/dsh-base. Insert the model-facing `zhihu_search`
# tool. This patch does NOT touch `web.config.searchProvider`, so it can sit
# beside `@wangshaodan/web-search-zhihu` (which backs `web_search`).

- insert:
    - id: tool-zhihu-search
      name: '@wangshaodan/web-search-zhihu-insite'
      config:
        apiKeyEnv: ZHIHU_ACCESS_SECRET
