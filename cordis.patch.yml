# Applied after @deepseek-ai/dsh-base. Pin search to Zhihu in-site and register
# the provider plugin. Later profile / home / --patch layers can still override
# `web.config.searchProvider` or `$DSH_WEB_SEARCH_PROVIDER`.

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: zhihu-insite-search

- insert:
    - id: web-search-zhihu-insite
      name: '@wangshaodan/web-search-zhihu-insite'
      config:
        apiKeyEnv: ZHIHU_ACCESS_SECRET
